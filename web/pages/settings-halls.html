<section id="hallSettingsRoot" class="view-stack">
  <div class="section-head">
    <div>
      <h3>影厅连接</h3>
      <p>管理影厅与 GDC 放映服务器的绑定关系。</p>
    </div>
    <button type="button" id="hallAddBtn" class="btn btn-sm btn-primary">
      <i class="fas fa-plus"></i>
      新增影厅
    </button>
  </div>

  <div id="hallSettingsStatus" class="alert alert-error hidden">
    <i class="fas fa-circle-xmark"></i>
    <span></span>
  </div>

  <div id="hallSettingsList" class="settings-connection-list"></div>
</section>

<dialog id="addHallModal" class="modal">
  <div class="modal-box max-w-2xl">
    <div id="addHallStep0">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 bg-primary/12 rounded-lg flex items-center justify-center text-primary">
          <i class="fas fa-ticket"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold">新增影厅</h3>
          <p class="text-sm text-base-content/60">从售票系统选择要添加的影厅</p>
        </div>
      </div>

      <div id="addHallListStatus" class="alert alert-info mb-4">
        <i class="fas fa-circle-info"></i>
        <span>正在从售票系统获取影厅列表...</span>
      </div>

      <div id="addHallList" class="space-y-2 max-h-72 overflow-y-auto"></div>
    </div>

    <div id="addHallStep1" class="hidden">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 bg-primary/12 rounded-lg flex items-center justify-center text-primary">
          <i class="fas fa-video"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold">配置放映服务器</h3>
          <p class="text-sm text-base-content/60">为 <strong id="addHallSelectedName">-</strong> 配置 GDC 放映服务器</p>
        </div>
      </div>

      <div class="grid grid-cols-[1fr_8rem] gap-3 mb-4">
        <label class="setup-field">
          <span>GDC 放映服务器地址</span>
          <input id="addHallHost" class="input input-bordered w-full" placeholder="192.168.10.11">
        </label>
        <label class="setup-field">
          <span>端口</span>
          <input id="addHallPort" class="input input-bordered w-full" value="5000" placeholder="5000">
        </label>
      </div>

      <div class="setup-test-panel">
        <button type="button" id="addHallTestBtn" class="btn btn-primary btn-sm">
          <i class="fas fa-plug"></i>
          测试连接
        </button>
        <div id="addHallTestResult" class="setup-test-result">
          <i class="fas fa-circle-info"></i>
          保存前需要先完成连接测试。
        </div>
      </div>

      <div id="addHallDeviceInfo" class="mt-4"></div>
    </div>

    <div class="modal-action">
      <button type="button" id="addHallBackBtn" class="btn btn-ghost hidden">
        <i class="fas fa-angle-left"></i>
        上一步
      </button>
      <div class="flex-1"></div>
      <button type="button" id="addHallCancelBtn" class="btn">取消</button>
      <button type="button" id="addHallNextBtn" class="btn btn-primary" disabled>
        下一步
        <i class="fas fa-angle-right"></i>
      </button>
      <button type="button" id="addHallSaveBtn" class="btn btn-primary hidden" disabled>
        <i class="fas fa-floppy-disk"></i>
        保存
      </button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

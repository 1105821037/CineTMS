<div class="kdm-shell hall-log-shell" data-bound="false">
  <section class="kdm-page-head">
    <div>
      <h2 class="text-3xl font-bold">GDC 日志</h2>
      <p class="mt-1 text-sm text-base-content/60">
        <span data-hall-log-field="hall-name">当前影厅</span>
        <span class="mx-1">/</span>
        GDC 事件日志
      </p>
    </div>

    <div class="hall-log-actions">
      <input id="hallLogDate" type="date" class="input input-bordered input-sm" data-hall-log-date>
      <button id="hallLogRefresh" type="button" class="btn btn-primary btn-sm gap-2">
        <i class="fas fa-magnifying-glass"></i>
        获取日志
      </button>
    </div>
  </section>

  <section id="hallLogStatus" class="alert alert-info">
    <i class="fas fa-circle-info"></i>
    <span>正在加载 GDC 日志...</span>
  </section>

  <section class="kdm-stats-grid">
    <div class="stats bg-base-100 shadow hover:shadow-lg transition-shadow">
      <div class="stat">
        <div class="stat-figure text-primary">
          <i class="fas fa-file-lines text-2xl"></i>
        </div>
        <div class="stat-title">日志日期</div>
        <div id="hallLogDateStat" class="stat-value text-primary hall-log-stat-value">-</div>
        <div class="stat-desc">GET_EVENT_LOGS 查询日期</div>
      </div>
    </div>

    <div class="stats bg-base-100 shadow hover:shadow-lg transition-shadow">
      <div class="stat">
        <div class="stat-figure text-success">
          <i class="fas fa-list text-2xl"></i>
        </div>
        <div class="stat-title">事件数</div>
        <div id="hallLogCount" class="stat-value text-success">-</div>
        <div class="stat-desc">GDC 返回 event 节点数量</div>
      </div>
    </div>

    <div class="stats bg-base-100 shadow hover:shadow-lg transition-shadow">
      <div class="stat">
        <div class="stat-figure text-info">
          <i class="fas fa-server text-2xl"></i>
        </div>
        <div class="stat-title">GDC 状态</div>
        <div id="hallLogOnlineState" class="stat-value text-info hall-log-stat-value">-</div>
        <div class="stat-desc">放映服务器连接状态</div>
      </div>
    </div>
  </section>

  <section class="card bg-base-100 shadow-xl">
    <div class="card-body gap-4">
      <div class="kdm-list-head">
        <div>
          <h3 class="card-title text-xl">
            <i class="fas fa-clock-rotate-left"></i>
            事件日志
          </h3>
        </div>
        <span id="hallLogBadge" class="badge badge-ghost">未加载</span>
      </div>

      <div id="hallLogList" class="hall-log-list"></div>
    </div>
  </section>
</div>
